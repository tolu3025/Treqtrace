{% extends "base.html" %}
{% block title %}{{ 'Edit' if test_case else 'New' }} Test Case — TreqTrace{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">
                        <i class="bi bi-{{ 'pencil' if test_case else 'plus-circle' }} text-warning"></i>
                        {{ 'Edit' if test_case else 'New' }} Test Case
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Test Case ID</label>
                                <input type="text" name="tc_id" class="form-control" value="{{ test_case.tc_id if test_case else '' }}" placeholder="e.g., TC-001" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" value="{{ test_case.title if test_case else '' }}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description / Steps</label>
                            <textarea name="description" class="form-control" rows="3">{{ test_case.description if test_case else '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Expected Result</label>
                            <textarea name="expected_result" class="form-control" rows="2">{{ test_case.expected_result if test_case else '' }}</textarea>
                        </div>
                        {% if test_case %}
                        <div class="mb-3">
                            <label class="form-label">Actual Result</label>
                            <textarea name="actual_result" class="form-control" rows="2">{{ test_case.actual_result or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Execution Status</label>
                            <select name="status" class="form-select">
                                <option value="not_executed" {{ 'selected' if test_case.status == 'not_executed' else '' }}>Not Executed</option>
                                <option value="passed" {{ 'selected' if test_case.status == 'passed' else '' }}>Passed</option>
                                <option value="failed" {{ 'selected' if test_case.status == 'failed' else '' }}>Failed</option>
                                <option value="blocked" {{ 'selected' if test_case.status == 'blocked' else '' }}>Blocked</option>
                            </select>
                        </div>
                        {% endif %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-white">{{ 'Update' if test_case else 'Create' }} Test Case</button>
                            <a href="{{ url_for('view_project', id=project.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
