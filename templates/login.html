{% extends "base.html" %}
{% block title %}Login — TreqTrace{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="TreqTrace" height="70">
                        <h3 class="mt-3">Welcome Back</h3>
                        <p class="text-muted">Sign in to your TreqTrace account</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign In</button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                    <p class="text-center text-muted small mt-2">Default: admin / admin123</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
