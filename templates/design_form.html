{% extends "base.html" %}
{% block title %}New Design Artifact — TreqTrace{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="bi bi-diagram-3 text-info"></i> New Design Artifact</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Artifact Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Artifact Type</label>
                            <select name="artifact_type" class="form-select">
                                <option value="Class Diagram">Class Diagram</option>
                                <option value="Sequence Diagram">Sequence Diagram</option>
                                <option value="Use Case Diagram">Use Case Diagram</option>
                                <option value="Wireframe">Wireframe</option>
                                <option value="ER Diagram">ER Diagram</option>
                                <option value="Architecture">Architecture</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Reference Link / File Path</label>
                            <input type="text" name="reference_link" class="form-control" placeholder="e.g., /docs/design/class_diagram.pdf">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info text-white">Add Artifact</button>
                            <a href="{{ url_for('view_project', id=project.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
